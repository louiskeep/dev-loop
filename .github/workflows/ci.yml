name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint
        run: |
          ruff check hooks/ tests/ conftest.py
          ruff format --check hooks/ tests/ conftest.py
      - name: Test
        run: pytest -q
